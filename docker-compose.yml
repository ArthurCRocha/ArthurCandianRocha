services:
  dev:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # node_modules em volume nomeado: binários nativos (esbuild, rollup) do
      # container são linux/arm64 e quebrariam se compartilhados com o host.
      - node_modules:/app/node_modules
    environment:
      # Bind mount no macOS não propaga eventos inotify.
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
